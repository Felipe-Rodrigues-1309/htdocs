services:
  - type: web
    name: f5-avaliacao
    runtime: node
    plan: free
    rootDir: render-api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SYNC_API_TOKEN
        sync: false
